name: Generate and Publish Development Repository
on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'
      - '*-dev'

jobs:
  repo-gen:
    name: Generate the development repository and upload it to the mirrors
    if: github.repository == 'anxdpanic/plugin.video.twitch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # lftp mirrors the repository; lxml is for the repository generator script
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y lftp
          python -m pip install --upgrade pip
          pip install lxml

      - name: Checkout Add-on
        uses: actions/checkout@v4
        with:
          path: ./checkout

      - name: Stage Add-ons and Repository Generator
        # The generator zips every add-on folder in ./development: the add-on and the repository add-on.
        run: |
          mkdir -p ./development
          cp -r ./checkout/plugin.video.twitch ./development/
          cp -r ./checkout/repository.twitch_development ./development/
          cp ./checkout/.scripts/.prepare_repository.py .
          cp ./checkout/.scripts/.config.json .

      - name: Generate Repository
        # Generate the zips, addons.xml and addons.xml.md5 in ./repository/python3
        run: |
          python .prepare_repository.py

      - name: Mirror Development Repository to FTP
        # https://download.osmc.tv/dev/anxdpanic/kodi/twitch/python3/ (the repository add-on's datadir)
        run: |
          lftp -c "\
          set ssl:verify-certificate false; \
          set sftp:auto-confirm yes; \
          open ${{ secrets.SFTP }}; \
          cd /root/anxdpanic/kodi/twitch/; \
          lcd repository/; \
          mirror --verbose --use-pget-n=8 -c --reverse --verbose python3 python3; \
          bye \
          "
